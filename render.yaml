# Render Blueprint for the FastAPI backend.
# No rootDir: the backend imports ../ml, so the whole repo must be available.
services:
  - type: web
    name: tunisia-climbing-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    preDeployCommand: cd backend && alembic upgrade head
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: comment-photos
      - key: CORS_ORIGINS
        sync: false
